name: Update official VA news feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *" # Daily at 12:17 UTC
  push:
    paths:
      - "scripts/fetch_va_rss.py"
      - ".github/workflows/update-va-news.yml"

permissions:
  contents: write

concurrency:
  group: update-va-news
  cancel-in-progress: false

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch official VA RSS feed
        run: python scripts/fetch_va_rss.py
      - name: Save updated news file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "News has not changed; nothing to commit."
          else
            git commit -m "Refresh official VA news feed"
            git push
          fi
